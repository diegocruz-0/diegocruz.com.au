<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} feed" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="container header__inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Diego Cruz — home">Diego Cruz<span aria-hidden="true">.</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
            <span class="visually-hidden">Open navigation</span>
            <span class="nav-toggle__icon" aria-hidden="true"></span>
          </button>
          <ul class="nav-links" id="nav-links">
            <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
            <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Blog</a></li>
          </ul>
        </nav>
      </div>
    </header>

    {{ content }}

    <footer class="site-footer">
      <div class="container footer__inner">
        <p>© {{ site.time | date: "%Y" }} Diego Cruz</p>
        <nav aria-label="Social links">
          <ul class="footer-links">
            <li><a href="https://www.linkedin.com/in/diegocruz-/" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a></li>
            <li><a href="https://github.com/diegocruz-0" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></li>
            <li><a href="{{ '/feed.xml' | relative_url }}">RSS feed</a></li>
          </ul>
        </nav>
      </div>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
